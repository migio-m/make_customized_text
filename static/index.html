<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スカウト文ジェネレーター</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .left { display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.78rem; color: #a0aec0; }
    header a { color: #90cdf4; font-size: 0.82rem; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: #ebf4ff;
      color: #3182ce;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #718096;
      margin-bottom: 6px;
    }

    select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1a1a2e;
      background: #fff;
      transition: border-color 0.15s;
      resize: vertical;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.12);
    }

    textarea { min-height: 200px; }

    .form-group { margin-bottom: 16px; }

    .resume-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .btn-scan, .btn-upload {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }

    .btn-scan {
      background: #ebf8ff;
      color: #2b6cb0;
      border: 1px solid #bee3f8;
    }

    .btn-scan:hover:not(:disabled) { background: #bee3f8; }

    .btn-upload {
      background: #f0fff4;
      color: #276749;
      border: 1px solid #c6f6d5;
    }

    .btn-upload:hover { background: #c6f6d5; }

    .btn-scan:disabled { opacity: 0.6; cursor: not-allowed; }

    .job-preview {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.82rem;
      color: #4a5568;
      white-space: pre-wrap;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.6;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary { background: #3182ce; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2b6cb0; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
      margin-top: 8px;
      font-size: 0.85rem;
      padding: 9px;
    }

    .btn-secondary:hover { background: #e2e8f0; }

    .result-section { grid-column: 1 / -1; }

    .result-field { margin-bottom: 16px; }

    .result-field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .result-text {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.8;
      white-space: pre-wrap;
      color: #1a1a2e;
      min-height: 60px;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .spinner-dark {
      border-color: rgba(49,130,206,0.3);
      border-top-color: #3182ce;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 8px;
      padding: 12px;
      color: #c53030;
      font-size: 0.85rem;
      margin-top: 12px;
    }

    .success-tag {
      background: #f0fff4;
      border: 1px solid #c6f6d5;
      color: #276749;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .hidden { display: none; }

    .copy-btn {
      font-size: 0.78rem;
      padding: 4px 10px;
      background: #ebf8ff;
      color: #2b6cb0;
      border: 1px solid #bee3f8;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
    }

    .copy-btn:hover { background: #bee3f8; }


    #file-input { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <h1>スカウト文ジェネレーター</h1>
      <span>Powered by Claude AI</span>
    </div>
    <a href="/admin">⚙ 管理画面</a>
  </header>

  <div class="container">
    <!-- 左: レジュメ入力 -->
    <div class="card">
      <h2>候補者レジュメ <span class="badge">STEP 1</span></h2>
      <div class="form-group">
        <label>レジュメを入力 または 画面・画像から読み取る</label>
        <div class="resume-actions">
          <button class="btn-scan" id="scan-btn" onclick="doScreenCapture()">
            🖥 画面をスキャン
          </button>
          <button class="btn-upload" onclick="document.getElementById('file-input').click()">
            📄 PDF・画像をアップロード
          </button>
          <input type="file" id="file-input" accept="image/*,.pdf" onchange="handleFileUpload(event)" />
        </div>
        <textarea id="resume" placeholder="氏名、職歴、スキル、学歴などを含むレジュメテキストをここに貼り付けてください...&#10;または上のボタンでビズリーチの画面から自動読み取り"></textarea>
      </div>
      <div id="scan-status" class="hidden" style="font-size:0.82rem; color:#3182ce; display:flex; align-items:center; gap:8px;">
        <span class="spinner spinner-dark"></span> レジュメを読み取り中...
      </div>
    </div>

    <!-- 右: 求人・テンプレート選択 -->
    <div class="card">
      <h2>求人票・テンプレート選択 <span class="badge">STEP 2</span></h2>
      <div class="form-group">
        <label>求人票を選択</label>
        <select id="job-select" onchange="onJobChange()">
          <option value="">-- 求人票を選択してください --</option>
        </select>
      </div>
      <div class="form-group" id="job-preview-area" style="display:none">
        <label>求人票の内容</label>
        <div class="job-preview" id="job-preview"></div>
      </div>
      <div class="form-group" id="template-area" style="display:none">
        <label>スカウト文テンプレートを選択</label>
        <select id="template-select"></select>
      </div>
      <button class="btn btn-primary" id="generate-btn" onclick="generate()" disabled>
        スカウト文を生成する
      </button>
      <div id="error-area" class="hidden"></div>
    </div>

    <!-- 出力 -->
    <div class="card result-section hidden" id="result-section">
      <h2>生成されたスカウト文</h2>
      <div id="result-meta" class="success-tag"></div>
      <div class="result-field">
        <label>件名 <button class="copy-btn" onclick="copyText('result-subject')">コピー</button></label>
        <div class="result-text" id="result-subject"></div>
      </div>
      <div class="result-field">
        <label>本文 <button class="copy-btn" onclick="copyText('result-body')">コピー</button></label>
        <div class="result-text" id="result-body"></div>
      </div>
      <button class="btn btn-secondary" onclick="resetResult()">もう一度生成する</button>
    </div>
  </div>


  <script>
    let jobs = [];

    async function loadJobs() {
      const res = await fetch('/api/jobs');
      jobs = await res.json();
      const sel = document.getElementById('job-select');
      jobs.forEach(j => {
        const opt = document.createElement('option');
        opt.value = j.id;
        opt.textContent = `${j.title}（${j.company}）`;
        sel.appendChild(opt);
      });
    }

    async function onJobChange() {
      const jobId = document.getElementById('job-select').value;
      document.getElementById('generate-btn').disabled = true;

      if (!jobId) {
        document.getElementById('job-preview-area').style.display = 'none';
        document.getElementById('template-area').style.display = 'none';
        return;
      }

      const job = jobs.find(j => j.id === jobId);
      document.getElementById('job-preview').textContent = job.description;
      document.getElementById('job-preview-area').style.display = 'block';

      try {
        const res = await fetch(`/api/templates/${jobId}`);
        if (!res.ok) {
          document.getElementById('template-area').style.display = 'none';
          showError('この求人票にテンプレートがありません。管理画面から追加してください。');
          return;
        }
        const templates = await res.json();
        const sel = document.getElementById('template-select');
        sel.innerHTML = '';
        templates.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.name;
          sel.appendChild(opt);
        });
        document.getElementById('template-area').style.display = 'block';
        document.getElementById('generate-btn').disabled = false;
        hideError();
      } catch {
        showError('テンプレートの読み込みに失敗しました');
      }
    }

    async function generate() {
      const resume = document.getElementById('resume').value.trim();
      const jobId = document.getElementById('job-select').value;
      const templateId = document.getElementById('template-select').value;

      if (!resume) { showError('レジュメを入力してください'); return; }
      if (!jobId || !templateId) { showError('求人票とテンプレートを選択してください'); return; }

      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 生成中...';
      hideError();

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume, job_id: jobId, template_id: templateId }),
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
        const data = await res.json();
        document.getElementById('result-subject').textContent = data.subject;
        document.getElementById('result-body').textContent = data.body;
        document.getElementById('result-meta').textContent = `✓ ${data.company} ／ ${data.job_title}`;
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        showError(e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'スカウト文を生成する';
      }
    }

    // --- Screen scan ---

    async function doScreenCapture() {

      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        showError('このブラウザは画面キャプチャに対応していません。Chrome / Edge をお使いください。');
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      } catch {
        return; // ユーザーがキャンセル
      }

      const video = document.createElement('video');
      video.srcObject = stream;
      await video.play();

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      stream.getTracks().forEach(t => t.stop());

      const dataUrl = canvas.toDataURL('image/png');
      await sendImageToExtract(dataUrl);
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => await sendImageToExtract(e.target.result);
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    async function sendImageToExtract(dataUrl) {
      const statusEl = document.getElementById('scan-status');
      const scanBtn = document.getElementById('scan-btn');
      statusEl.classList.remove('hidden');
      statusEl.style.display = 'flex';
      scanBtn.disabled = true;
      hideError();

      try {
        const res = await fetch('/api/extract-resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_base64: dataUrl }),
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
        const data = await res.json();
        document.getElementById('resume').value = data.resume_text;
      } catch (e) {
        showError('読み取りに失敗しました: ' + e.message);
      } finally {
        statusEl.style.display = 'none';
        statusEl.classList.add('hidden');
        scanBtn.disabled = false;
      }
    }

    // --- Helpers ---

    function showError(msg) {
      const el = document.getElementById('error-area');
      el.innerHTML = `<div class="error-msg">${msg}</div>`;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-area').classList.add('hidden');
    }

    function resetResult() {
      document.getElementById('result-section').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function copyText(id) {
      await navigator.clipboard.writeText(document.getElementById(id).textContent);
      alert('コピーしました！');
    }

    loadJobs();
  </script>
</body>
</html>
