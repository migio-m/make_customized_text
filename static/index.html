<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スカウト文ジェネレーター</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 0.8rem; color: #a0aec0; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2 .badge {
      background: #ebf4ff;
      color: #3182ce;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #718096;
      margin-bottom: 6px;
    }

    select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1a1a2e;
      background: #fff;
      transition: border-color 0.15s;
      resize: vertical;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.12);
    }

    textarea { min-height: 180px; }

    .form-group { margin-bottom: 16px; }

    .job-preview {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.82rem;
      color: #4a5568;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      line-height: 1.6;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: #3182ce;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { background: #2b6cb0; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
      margin-top: 8px;
      font-size: 0.85rem;
      padding: 9px;
    }

    .btn-secondary:hover { background: #e2e8f0; }

    .result-section {
      grid-column: 1 / -1;
    }

    .result-field {
      margin-bottom: 16px;
    }

    .result-field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .result-text {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.8;
      white-space: pre-wrap;
      color: #1a1a2e;
      min-height: 60px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 8px;
      padding: 12px;
      color: #c53030;
      font-size: 0.85rem;
      margin-top: 12px;
    }

    .success-tag {
      background: #f0fff4;
      border: 1px solid #c6f6d5;
      color: #276749;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .hidden { display: none; }

    .copy-btn {
      font-size: 0.78rem;
      padding: 4px 10px;
      background: #ebf8ff;
      color: #2b6cb0;
      border: 1px solid #bee3f8;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
    }

    .copy-btn:hover { background: #bee3f8; }
  </style>
</head>
<body>
  <header>
    <h1>スカウト文ジェネレーター</h1>
    <span>Powered by Claude AI</span>
  </header>

  <div class="container">
    <!-- 左カラム: レジュメ入力 -->
    <div class="card">
      <h2>候補者レジュメ <span class="badge">STEP 1</span></h2>
      <div class="form-group">
        <label>ビズリーチのレジュメをペーストしてください</label>
        <textarea id="resume" placeholder="氏名、職歴、スキル、学歴などを含むレジュメテキストをここに貼り付けてください..."></textarea>
      </div>
    </div>

    <!-- 右カラム: 求人・テンプレート選択 -->
    <div class="card">
      <h2>求人票・テンプレート選択 <span class="badge">STEP 2</span></h2>
      <div class="form-group">
        <label>求人票を選択</label>
        <select id="job-select" onchange="onJobChange()">
          <option value="">-- 求人票を選択してください --</option>
        </select>
      </div>
      <div class="form-group" id="job-preview-area" style="display:none">
        <label>求人票の内容</label>
        <div class="job-preview" id="job-preview"></div>
      </div>
      <div class="form-group" id="template-area" style="display:none">
        <label>スカウト文テンプレートを選択</label>
        <select id="template-select"></select>
      </div>
      <button class="btn btn-primary" id="generate-btn" onclick="generate()" disabled>
        スカウト文を生成する
      </button>
      <div id="error-area" class="hidden"></div>
    </div>

    <!-- 出力エリア -->
    <div class="card result-section hidden" id="result-section">
      <h2>生成されたスカウト文</h2>
      <div id="result-meta" class="success-tag"></div>
      <div class="result-field">
        <label>件名 <button class="copy-btn" onclick="copyText('result-subject')">コピー</button></label>
        <div class="result-text" id="result-subject"></div>
      </div>
      <div class="result-field">
        <label>本文 <button class="copy-btn" onclick="copyText('result-body')">コピー</button></label>
        <div class="result-text" id="result-body"></div>
      </div>
      <button class="btn btn-secondary" onclick="resetResult()">もう一度生成する</button>
    </div>
  </div>

  <script>
    let jobs = [];
    let templates = [];

    async function loadJobs() {
      const res = await fetch('/api/jobs');
      jobs = await res.json();
      const sel = document.getElementById('job-select');
      jobs.forEach(j => {
        const opt = document.createElement('option');
        opt.value = j.id;
        opt.textContent = `${j.title}（${j.company}）`;
        sel.appendChild(opt);
      });
    }

    async function onJobChange() {
      const jobId = document.getElementById('job-select').value;
      document.getElementById('generate-btn').disabled = true;

      if (!jobId) {
        document.getElementById('job-preview-area').style.display = 'none';
        document.getElementById('template-area').style.display = 'none';
        return;
      }

      const job = jobs.find(j => j.id === jobId);
      document.getElementById('job-preview').textContent = job.description;
      document.getElementById('job-preview-area').style.display = 'block';

      const res = await fetch(`/api/templates/${jobId}`);
      templates = await res.json();
      const sel = document.getElementById('template-select');
      sel.innerHTML = '';
      templates.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name;
        sel.appendChild(opt);
      });
      document.getElementById('template-area').style.display = 'block';
      document.getElementById('generate-btn').disabled = false;
    }

    async function generate() {
      const resume = document.getElementById('resume').value.trim();
      const jobId = document.getElementById('job-select').value;
      const templateId = document.getElementById('template-select').value;

      if (!resume) {
        showError('レジュメを入力してください');
        return;
      }
      if (!jobId || !templateId) {
        showError('求人票とテンプレートを選択してください');
        return;
      }

      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 生成中...';
      hideError();

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume, job_id: jobId, template_id: templateId }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'エラーが発生しました');
        }

        const data = await res.json();
        document.getElementById('result-subject').textContent = data.subject;
        document.getElementById('result-body').textContent = data.body;
        document.getElementById('result-meta').textContent =
          `✓ ${data.company} ／ ${data.job_title}`;
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        showError(e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'スカウト文を生成する';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-area');
      el.innerHTML = `<div class="error-msg">${msg}</div>`;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-area').classList.add('hidden');
    }

    function resetResult() {
      document.getElementById('result-section').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function copyText(elementId) {
      const text = document.getElementById(elementId).textContent;
      await navigator.clipboard.writeText(text);
      alert('コピーしました！');
    }

    loadJobs();
  </script>
</body>
</html>
